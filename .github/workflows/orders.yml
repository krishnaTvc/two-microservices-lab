name: Orders service CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'orders-service/**'
      - '.github/workflows/orders.yml'
      - 'scripts/publish-and-deploy.sh'
      - 'deploy/deploy-service.sh'
  push:
    branches: [main]
    paths:
      - 'orders-service/**'
      - '.github/workflows/orders.yml'
      - 'scripts/publish-and-deploy.sh'
      - 'deploy/deploy-service.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orders-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Manual deployment is allowed from main only.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: orders-service/pom.xml

      - name: Test and build orders-service independently
        run: mvn -B --no-transfer-progress -f orders-service/pom.xml clean verify

      - name: Check deployment configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          APP_INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
        run: |
          for variable in AWS_REGION AWS_ACCOUNT_ID AWS_ROLE_ARN ARTIFACT_BUCKET APP_INSTANCE_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository Actions variable: $variable"
              exit 1
            fi
          done

      - name: Authenticate to AWS using GitHub OIDC
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-orders-${{ github.run_id }}
          unset-current-credentials: true
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Publish JAR and deploy only orders-service
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          APP_INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
        run: bash scripts/publish-and-deploy.sh orders-service orders-service/target/orders-service.jar
